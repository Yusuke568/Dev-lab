# Apache POI（作業報告書Excelの出力・取込）は Log4j2 の API でログを出す。
# このアプリは log4j-core を入れていないので、Log4j2 に最初から入っている簡易ロガーを使うよう指定する。
# 指定しないと、起動時に「Log4j2 could not find a logging implementation」のエラーが出る。
# 簡易ロガーの出力レベルなどは log4j2.simplelog.properties で設定する。
log4j2.loggerContextFactory=org.apache.logging.log4j.simple.SimpleLoggerContextFactory
